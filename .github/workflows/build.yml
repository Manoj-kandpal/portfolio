name: SSG Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run SSG Build Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
      run: node scripts/build.js

    - name: Verify build artifact integrity
      run: test -s index.html
